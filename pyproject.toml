# ruff / mypy 配置（pytest 配置在 pytest.ini）

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "notes", ".git"]

[tool.ruff.lint]
# 选定的规则族：错误/未用（E,W,F）、import 排序（I）、现代化（UP）、
# 常见陷阱（B）、盲 except（BLE）、时区（DTZ）、ruff 自有（RUF）、重构建议（FURB）
select = ["E", "W", "F", "I", "UP", "B", "BLE", "DTZ", "RUF", "FURB"]
ignore = [
    # 本项目的中文注释/文案刻意使用全角标点（：（） ，），不是笔误
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里允许长函数/多断言/魔法值
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["core", "agents", "service", "app", "tools.py", "main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# 渐进式：先保证「已有注解自洽」，不强制全量注解
disallow_untyped_defs = false
