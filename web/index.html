<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResearchSwarm · 多 Agent 深度研究</title>
  <!--
    卡片仪表盘界面（B 风格）。功能：发起 / 流式时间线 / 停止 / 报告渲染 / 来源 / 失败项 /
    设置（API Key、演示模式）/ 历史 / 导出。零外部依赖，纯原生 JS。

    接口契约见 docs/api.md。
  -->
  <style>
    :root {
      --bg:#0d0f14; --bg-soft:#12151d; --card:#171b25; --card-2:#1d2230;
      --line:#252b3a; --fg:#e8ecf5; --dim:#8b93a7; --dim-2:#5d6579;
      --accent:#5aa9ff; --accent-2:#3d7dd6; --ok:#57d68d; --warn:#ffb454; --err:#ff6b6b;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin:0; background:
        radial-gradient(1200px 600px at 15% -10%, #17203a 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 0%, #1a1730 0%, transparent 55%), var(--bg);
      color:var(--fg);
      font:14px/1.65 "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
      -webkit-font-smoothing: antialiased;
    }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }

    /* ---------- 顶栏 ---------- */
    header {
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding:14px 20px; background:rgba(20,24,33,.82); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;
    }
    .brand { display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.4px; }
    .brand .dot { width:10px; height:10px; border-radius:50%;
      background:linear-gradient(135deg,var(--accent),#9d7bff); box-shadow:0 0 12px rgba(90,169,255,.7); }
    .brand small { color:var(--dim-2); font-weight:400; letter-spacing:0; }
    #query {
      flex:1; min-width:240px; padding:10px 14px; border-radius:10px;
      border:1px solid var(--line); background:#0b0e14; color:var(--fg); font:inherit;
    }
    #query:focus { outline:none; border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(90,169,255,.12); }
    button {
      padding:10px 16px; border-radius:10px; border:1px solid transparent; cursor:pointer;
      background:linear-gradient(180deg,var(--accent),var(--accent-2)); color:#04101f;
      font:inherit; font-weight:700; transition:transform .06s ease, opacity .15s ease;
    }
    button:hover:not(:disabled) { transform:translateY(-1px); }
    button.ghost { background:var(--card-2); color:var(--fg); border-color:var(--line); font-weight:600; }
    button:disabled { opacity:.42; cursor:not-allowed; transform:none; }
    .pill { padding:5px 11px; border-radius:999px; font-size:12px; border:1px solid var(--line);
            background:var(--card); color:var(--dim); }
    .pill.ok { color:var(--ok); border-color:rgba(87,214,141,.35); }
    .pill.warn { color:var(--warn); border-color:rgba(255,180,84,.35); }
    .pill.err { color:var(--err); border-color:rgba(255,107,107,.35); }
    #status { margin-left:auto; }

    /* ---------- 进度条 ---------- */
    #progress { height:2px; background:transparent; overflow:hidden; }
    #progress.on { background:linear-gradient(90deg,transparent,var(--accent),transparent);
      background-size:40% 100%; animation:slide 1.1s linear infinite; }
    @keyframes slide { from { background-position:-40% 0; } to { background-position:140% 0; } }

    /* ---------- 设置面板 ---------- */
    #settings { display:none; padding:16px 20px; background:var(--bg-soft); border-bottom:1px solid var(--line); }
    #settings.open { display:block; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; align-items:end; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { color:var(--dim); font-size:12px; letter-spacing:.3px; }
    .field input[type=text], .field input[type=password] {
      padding:9px 12px; border-radius:9px; border:1px solid var(--line);
      background:#0b0e14; color:var(--fg); font:inherit;
    }
    .switch { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; }
    #configPath { color:var(--dim-2); font-size:12px; grid-column:1/-1; word-break:break-all; }

    /* ---------- 主体 ---------- */
    main { display:grid; grid-template-columns:minmax(330px,400px) 1fr; gap:16px; padding:16px 20px 28px; }
    @media (max-width:1000px) { main { grid-template-columns:1fr; } }
    .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
    .card { background:linear-gradient(180deg,var(--card),var(--card-2)); border:1px solid var(--line);
            border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; min-width:0; }
    .card > h2 { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:12px;
                 text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); }
    .card > h2 .count { color:var(--dim-2); font-weight:400; letter-spacing:0; text-transform:none; }
    .card > h2 .spacer { flex:1; }
    .scroll { max-height:min(46vh,520px); overflow:auto; }
    .scroll.tall { max-height:none; }

    /* ---------- 时间线 ---------- */
    #timeline { list-style:none; margin:0; padding:0; }
    #timeline li { display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px dashed var(--line); }
    #timeline li:last-child { border-bottom:0; }
    #timeline .step-dot { width:8px; height:8px; border-radius:50%; background:var(--dim-2); flex:0 0 auto; }
    #timeline li.running .step-dot { background:var(--accent); box-shadow:0 0 0 4px rgba(90,169,255,.16); animation:pulse 1.2s ease-in-out infinite; }
    #timeline li.done .step-dot { background:var(--ok); }
    #timeline li.warn .step-dot { background:var(--warn); }
    #timeline .agent { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    #timeline .meta { color:var(--dim); font-size:12px; white-space:nowrap; }
    @keyframes pulse { 0%,100% { box-shadow:0 0 0 3px rgba(90,169,255,.10);} 50% { box-shadow:0 0 0 6px rgba(90,169,255,.20);} }

    /* ---------- 统计 ---------- */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
    .stat { background:#12161f; border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
    .stat b { display:block; font-size:17px; }
    .stat span { color:var(--dim); font-size:11px; letter-spacing:.4px; }

    /* ---------- 历史 ---------- */
    #history { list-style:none; margin:0; padding:0; }
    #history li { position:relative; padding:9px 36px 9px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
    #history li:last-child { border-bottom:0; }
    #history li:hover .q { color:var(--accent); }
    #history .q { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #history .meta { color:var(--dim-2); font-size:12px; }
    #history .del { position:absolute; top:8px; right:0; padding:2px 9px; font-size:13px; line-height:1.3;
                    background:#2a1f26; color:#ff9d9d; border:1px solid #4a2b33; border-radius:6px; font-weight:700; }
    #history .del:hover:not(:disabled) { background:#4d2830; color:#fff; }
    button.danger { background:#3a2229; color:#ffb4b4; border-color:#4a2b33; }
    button.danger:hover:not(:disabled) { background:#4d2830; color:#fff; }

    /* ---------- 报告 ---------- */
    #report { font-size:14px; line-height:1.75; }
    #report h2 { font-size:18px; margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
    #report h3 { font-size:15px; margin:16px 0 6px; color:#cfd8ea; }
    #report h4, #report h5 { font-size:14px; margin:12px 0 4px; color:#c3cddf; }
    #report p { margin:8px 0; }
    #report ul { margin:8px 0 8px 20px; padding:0; }
    #report code { background:#0b0e14; border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:13px; }
    #report strong { color:#fff; }
    .placeholder { color:var(--dim-2); }

    #sources ol { margin:6px 0 0 18px; padding:0; }
    #sources li { margin:4px 0; }
    #sources .host { color:var(--dim-2); font-size:12px; }
    #failures ul { margin:6px 0 0 18px; padding:0; }
    #failures li { color:#ffd9a8; }

    .empty { color:var(--dim-2); font-size:13px; padding:6px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>ResearchSwarm <small>· 5 Agent 协作</small></div>
    <input id="query" type="text" placeholder="输入研究问题，回车开始，例如：AI Agent 的发展趋势" autocomplete="off" />
    <button id="run">开始调研</button>
    <button id="stop" class="ghost" disabled>停止</button>
    <button id="settingsToggle" class="ghost">设置</button>
    <span id="status" class="pill">就绪</span>
  </header>
  <div id="progress"></div>

  <div id="settings">
    <div class="grid">
      <div class="field">
        <label for="apiKey">API Key（只回传掩码，不显示明文）</label>
        <input id="apiKey" type="password" placeholder="尚未配置" />
      </div>
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" type="text" placeholder="可留空，默认官方地址" />
      </div>
      <div class="field">
        <label for="model">模型</label>
        <input id="model" type="text" placeholder="如 deepseek-chat" />
      </div>
      <div class="field">
        <label>操作</label>
        <div style="display:flex;gap:8px">
          <button id="saveConfig">保存</button>
          <button id="verifyConfig" class="ghost">验证</button>
        </div>
      </div>
      <div class="switch" style="grid-column:1/-1">
        <input id="demoMode" type="checkbox" />
        <label for="demoMode">演示模式（离线桩 + 真实流水线：不联网、不花 token，可用于面试现场演示）</label>
      </div>
      <div id="configPath"></div>
    </div>
  </div>

  <main>
    <div class="col">
      <section class="card">
        <h2>执行时间线 <span class="spacer"></span><span class="count" id="stepCount"></span></h2>
        <ul id="timeline" class="scroll"></ul>
        <div id="timelineEmpty" class="empty">还没有运行。输入问题开始，这里会实时显示每个 Agent 的进度。</div>
        <div class="stats">
          <div class="stat"><b id="statTime">–</b><span>耗时</span></div>
          <div class="stat"><b id="statTokens">–</b><span>TOKENS</span></div>
          <div class="stat"><b id="statCalls">–</b><span>LLM 调用</span></div>
        </div>
      </section>

      <section class="card">
        <h2>历史运行 <span class="spacer"></span><span class="count" id="historyCount"></span>
          <button id="clearHistory" class="ghost danger" style="padding:3px 10px;font-size:12px" disabled>清空全部</button>
        </h2>
        <ul id="history" class="scroll"></ul>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2>研究报告
          <span class="spacer"></span>
          <span class="count" id="reportMeta"></span>
          <button id="copyBtn" class="ghost" style="padding:4px 10px;font-size:12px" disabled>复制</button>
          <button id="exportBtn" class="ghost" style="padding:4px 10px;font-size:12px" disabled>导出 MD</button>
        </h2>
        <div id="report" class="placeholder">报告将在这里出现。</div>
      </section>

      <section class="card" id="failuresCard" style="display:none">
        <h2>调研失败项 <span class="spacer"></span><span class="count" id="failureCount"></span></h2>
        <div id="failures"></div>
      </section>

      <section class="card" id="sourcesCard" style="display:none">
        <h2>参考来源 <span class="spacer"></span><span class="count" id="sourceCount"></span></h2>
        <div id="sources"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let runId = null;
    let source = null;
    let running = false;

    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ESC[c]);
    const secs = (ms) => `${((ms || 0) / 1000).toFixed(1)}s`;
    const hostOf = (url) => { try { return new URL(url).host; } catch { return ""; } };

    function setStatus(text, kind = "") {
      $("status").textContent = text;
      $("status").className = "pill" + (kind ? " " + kind : "");
    }
    function setRunning(on) {
      running = on;
      $("run").disabled = on;
      $("stop").disabled = !on;
      $("progress").className = on ? "on" : "";
    }

    /* ---------------- 迷你 Markdown（先转义再套标签，天然防注入） ---------------- */
    function markdown(md) {
      const inline = (s) => esc(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      const out = [];
      let inList = false;
      const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
      for (const raw of String(md || "").split(/\r?\n/)) {
        const line = raw.replace(/\s+$/, "");
        const heading = /^(#{1,6})\s+(.*)$/.exec(line);
        const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
        const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
        if (heading) {
          closeList();
          const level = Math.min(heading[1].length + 1, 6);
          out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        } else if (bullet) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inline(bullet[1])}</li>`);
        } else if (numbered) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inline(numbered[1])}</li>`);
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          out.push(`<p>${inline(line)}</p>`);
        }
      }
      closeList();
      return out.join("");
    }

    /* ---------------- 时间线 ---------------- */
    function addStep(agent, text, cls) {
      $("timelineEmpty").style.display = "none";
      const li = document.createElement("li");
      li.className = cls || "";
      li.innerHTML = `<span class="step-dot"></span><span class="agent">${esc(agent)}</span><span class="meta">${esc(text)}</span>`;
      $("timeline").appendChild(li);
      li.scrollIntoView({ block: "nearest" });
      $("stepCount").textContent = `${$("timeline").children.length} 步`;
      return li;
    }

    function renderEvent(ev) {
      switch (ev.type) {
        case "run_started":
          $("timeline").innerHTML = "";
          resetReport();
          addStep("开始", ev.data.query, "running");
          setStatus("运行中…", "");
          break;
        case "step_started": {
          const li = addStep(ev.agent, "执行中…", "running");
          li.dataset.agent = ev.agent;
          break;
        }
        case "step_finished": {
          const li = [...$("timeline").children].reverse()
            .find((n) => n.dataset.agent === ev.agent && n.classList.contains("running"));
          if (li) {
            li.className = "done";
            const tokens = ev.data?.usage?.total_tokens ?? 0;
            li.querySelector(".meta").textContent = `${secs(ev.duration_ms)} · ${tokens} tok`;
            delete li.dataset.agent;
          }
          break;
        }
        case "round_started":
          addStep("补研", `第 ${ev.data.round} 轮 · 缺口 ${ev.data.gaps.length} / 失败 ${ev.data.failures.length}`, "warn");
          break;
        case "round_skipped":
          addStep("补研", "没有可补研的子任务", "warn");
          break;
        case "rewrite_started":
          addStep("评审", `打回重写 ${ev.data.revision}/${ev.data.max_revisions}`, "warn");
          break;
        case "run_cancelled":
          addStep("已取消", `阶段：${ev.data.stage}（已完成产出保留）`, "warn");
          break;
        case "run_finished":
          addStep("完成", ev.data.stop_reason, "done");
          break;
      }
    }

    /* ---------------- 结果渲染 ---------------- */
    function resetReport() {
      $("report").className = "placeholder";
      $("report").textContent = "运行中…";
      $("reportMeta").textContent = "";
      $("sourcesCard").style.display = "none";
      $("failuresCard").style.display = "none";
      $("copyBtn").disabled = true;
      $("exportBtn").disabled = true;
      $("statTime").textContent = "–";
      $("statTokens").textContent = "–";
      $("statCalls").textContent = "–";
    }

    function clearReportPanel() {
      runId = null;
      $("report").className = "placeholder";
      $("report").textContent = "报告将在这里出现。";
      $("reportMeta").textContent = "";
      $("sourcesCard").style.display = "none";
      $("failuresCard").style.display = "none";
      $("copyBtn").disabled = true;
      $("exportBtn").disabled = true;
      $("statTime").textContent = "–";
      $("statTokens").textContent = "–";
      $("statCalls").textContent = "–";
    }

    function renderResult(data) {
      const usage = data.usage || {};
      $("report").className = "";
      $("report").innerHTML = markdown(data.report || "（本次没有产出报告）");
      $("reportMeta").textContent =
        `${data.status} · ${data.stop_reason || "-"} · 计划 ${(data.plan || []).length} 项 · ` +
        `补研 ${data.research_rounds ?? 0} 轮 · 重写 ${data.revision_count ?? 0} 次`;

      $("statTime").textContent = secs(data.duration_ms);
      $("statTokens").textContent = (usage.total_tokens || 0).toLocaleString();
      $("statCalls").textContent = usage.calls || 0;

      const failures = data.failures || {};
      const keys = Object.keys(failures);
      $("failuresCard").style.display = keys.length ? "" : "none";
      $("failureCount").textContent = keys.length ? `${keys.length} 项` : "";
      $("failures").innerHTML = keys.map((k) => `<div><b>${esc(k)}</b>：${esc(failures[k])}</div>`).join("");

      const sources = data.sources || [];
      $("sourcesCard").style.display = sources.length ? "" : "none";
      $("sourceCount").textContent = sources.length ? `${sources.length} 条` : "";
      $("sources").innerHTML = sources.length
        ? `<ol>${sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.title || s.url)}</a>
             <span class="host">${esc(hostOf(s.url))}</span></li>`).join("")}</ol>`
        : "";

      $("copyBtn").disabled = !data.report;
      $("exportBtn").disabled = !data.run_id;
      $("copyBtn").onclick = async () => {
        try { await navigator.clipboard.writeText(data.report || ""); setStatus("已复制报告", "ok"); }
        catch { setStatus("复制失败（浏览器限制）", "err"); }
      };
      $("exportBtn").onclick = () => window.open(`/api/runs/${data.run_id}/export`, "_blank");
    }

    async function loadRun(id) {
      const res = await fetch(`/api/runs/${id}`);
      if (!res.ok) { setStatus(`读取失败：${res.status}`, "err"); return; }
      runId = id;
      renderResult(await res.json());
    }

    async function loadHistory() {
      const res = await fetch("/api/history?limit=20");
      if (!res.ok) return;
      const data = await res.json();
      const runs = data.runs || [];
      $("historyCount").textContent = data.total ? `${data.total} 条` : "";
      $("clearHistory").disabled = !runs.length;
      $("history").innerHTML = runs.length
        ? runs.map((r) => `<li data-id="${esc(r.run_id)}">
             <span class="q">${esc(r.query)}</span>
             <span class="meta">${esc(r.status)} · ${secs(r.duration_ms)} · ${(r.usage?.total_tokens || 0)} tok · ${esc((r.finished_at || "").slice(0, 16).replace("T", " "))}</span>
             <button class="del" data-del="${esc(r.run_id)}" title="删除这条历史记录">✕</button>
           </li>`).join("")
        : `<li class="empty">还没有历史记录</li>`;

      [...$("history").querySelectorAll("li[data-id]")].forEach((li) => {
        li.onclick = () => loadRun(li.dataset.id);
      });
      [...$("history").querySelectorAll("button[data-del]")].forEach((btn) => {
        btn.onclick = (event) => {
          event.stopPropagation();  // 点删除不要顺带触发"回看这条"
          deleteOne(btn.dataset.del);
        };
      });
    }

    async function deleteOne(id) {
      if (!confirm("删除这条历史记录？删除后不可恢复。")) return;
      const res = await fetch(`/api/runs/${id}`, { method: "DELETE" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus(`删除失败：${data.detail || res.status}`, "err"); return; }
      if (runId === id) clearReportPanel();
      setStatus(`已删除 1 条历史（剩余 ${data.total} 条）`, "ok");
      await loadHistory();
    }

    async function clearAllHistory() {
      if (!confirm("确定清空全部历史记录？删除后不可恢复。")) return;
      const res = await fetch("/api/history", { method: "DELETE" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus(`清空失败：${data.detail || res.status}`, "err"); return; }
      clearReportPanel();
      const note = data.active_run ? "（正在运行的任务结束后仍会记录）" : "";
      setStatus(`已清空 ${data.deleted} 条历史${note}`, "ok");
      await loadHistory();
    }

    function streamEvents(id) {
      source = new EventSource(`/api/runs/${id}/events`);
      source.onmessage = (msg) => renderEvent(JSON.parse(msg.data));
      source.addEventListener("end", async () => {
        source.close(); source = null;
        setRunning(false);
        setStatus("完成", "ok");
        await loadRun(id);
        await loadHistory();
      });
      source.onerror = () => {
        if (source) { setStatus("事件流断开", "err"); setRunning(false); }
      };
    }

    async function startRun() {
      const query = $("query").value.trim();
      if (!query || running) return;
      setRunning(true);
      setStatus("正在启动…");
      const res = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus(`启动失败：${err.detail || res.status}`, "err");
        setRunning(false);
        return;
      }
      const data = await res.json();
      runId = data.run_id;
      setStatus(`运行中 · ${runId}`);
      streamEvents(runId);
    }

    /* ---------------- 事件绑定 ---------------- */
    $("run").onclick = startRun;
    $("query").addEventListener("keydown", (event) => { if (event.key === "Enter") startRun(); });
    $("stop").onclick = async () => {
      if (!runId) return;
      $("stop").disabled = true;
      setStatus("正在停止…（当前 LLM 调用结束后生效）", "warn");
      await fetch(`/api/runs/${runId}/cancel`, { method: "POST" });
    };
    $("settingsToggle").onclick = () => $("settings").classList.toggle("open");
    $("clearHistory").onclick = clearAllHistory;

    /* ---------------- 设置 ---------------- */
    async function loadConfig() {
      const res = await fetch("/api/config");
      if (!res.ok) return;
      const cfg = await res.json();
      $("apiKey").placeholder = cfg.has_api_key ? `已保存：${cfg.api_key_masked}` : "尚未配置";
      $("baseUrl").value = cfg.base_url || "";
      $("model").value = cfg.model || "";
      $("demoMode").checked = !!cfg.demo;
      $("configPath").textContent = `配置文件：${cfg.config_path}`;
      if (!cfg.has_api_key && !cfg.demo) {
        setStatus("未配置 API Key —— 可开启演示模式先体验", "warn");
      }
    }

    $("saveConfig").onclick = async () => {
      const body = { base_url: $("baseUrl").value.trim(), model: $("model").value.trim() };
      const key = $("apiKey").value.trim();
      if (key) body.api_key = key;  // 留空表示不改动已保存的 Key
      const res = await fetch("/api/config", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const cfg = await res.json();
      $("apiKey").value = "";
      $("apiKey").placeholder = cfg.has_api_key ? `已保存：${cfg.api_key_masked}` : "尚未配置";
      setStatus(cfg.saved ? "配置已保存" : "没有需要保存的改动", "ok");
    };

    $("verifyConfig").onclick = async () => {
      setStatus("验证中…", "warn");
      const res = await fetch("/api/config/verify", { method: "POST" });
      const data = await res.json();
      if (data.ok) setStatus(`配置可用（${data.mode === "demo" ? "演示模式" : "真实调用"}）`, "ok");
      else setStatus(`配置不可用：${data.error || ""}`, "err");
    };

    $("demoMode").onchange = async (event) => {
      const res = await fetch("/api/demo", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: event.target.checked }),
      });
      const data = await res.json();
      setStatus(data.enabled ? "已开启演示模式：不调用真实 API" : "已切回真实调用", "ok");
    };

    loadConfig();
    loadHistory();
  </script>
</body>
</html>
